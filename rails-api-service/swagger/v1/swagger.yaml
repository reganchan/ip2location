openapi: 3.0.0
info:
  title: IP Location API
  version: '1.0'
  description: API for looking up IP/hostname geolocation data
servers:
  - url: http://localhost:3000
    description: Local server
paths:
  /api/v1/locations:
    parameters:
      - $ref: '#/components/parameters/XApiKeyHeader'
    post:
      summary: Create a new location by IP or hostname
      operationId: createLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location
              properties:
                location:
                  type: object
                  properties:
                    ip_address:
                      type: string
                      example: 8.8.8.8
                    hostname:
                      type: string
                      example: google.com
                  description: Either ip_address or hostname must be provided
      responses:
        '201':
          description: Location created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  location_id:
                    type: integer
                    example: 1
        '400':
          description: Bad request - missing parameters or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal server error - IPStack API failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - api_key: []
  /api/v1/locations/{id}:
    delete:
      summary: Delete a location by ID
      operationId: deleteLocation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Location deleted successfully
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - api_key: []
    get:
      summary: Get a location by ID
      operationId: getLocationById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Location found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - api_key: []
  /api/v1/locations:
    get:
      summary: List all locations with pagination
      operationId: listLocations
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: A paginated list of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          description: Unauthorized - missing or invalid API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      security:
        - api_key: []
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Location:
      type: object
      properties:
        id:
          type: integer
        ip_address:
          type: string
        hostname:
          type: string
        address_type:
          type: string
        country_code:
          type: string
        country_name:
          type: string
        region_name:
          type: string
        city:
          type: string
        zip_code:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        raw_response:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time