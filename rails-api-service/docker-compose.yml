version: '3.8'
services:
  db:
    image: mariadb:10.6
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rails_api_development}
      MYSQL_USER: ${MYSQL_USER:-rails}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/rails-api-service
    environment:
      MYSQL_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rails_api_development}
      MYSQL_DATABASE_TEST: ${MYSQL_DATABASE_TEST:-rails_api_test}
      MYSQL_USER: ${MYSQL_USER:-rails}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      IPSTACK_ACCESS_KEY: ${IPSTACK_ACCESS_KEY}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-12345678}
    depends_on:
      - db

volumes:
  db_data: